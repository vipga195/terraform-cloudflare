name: terraform

on:
  pull_request:
    branches: [main]
    paths: ["**.tf", ".terraform.lock.hcl", ".github/workflows/**", ".github/actions/**"]
  push:
    branches: [main]
    paths: ["**.tf", ".terraform.lock.hcl", ".github/workflows/**", ".github/actions/**"]

permissions:
  contents: read

# No state locking on R2 backend: never run two Terraform jobs at once
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.4"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  plan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/terraform-init
      - run: terraform fmt -check
      - run: terraform validate
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color | tee plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/terraform-init
      - run: terraform apply -input=false -auto-approve
